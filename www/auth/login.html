<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login | Webserv</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#080d18] font-sans text-slate-100 antialiased">
	<!-- Background -->
	<div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
		<div class="absolute left-1/2 top-[-16rem] h-[34rem] w-[50rem] -translate-x-1/2 rounded-full bg-sky-500/10 blur-3xl"></div>
		<div class="absolute bottom-[-12rem] right-[-8rem] h-[28rem] w-[28rem] rounded-full bg-blue-600/10 blur-3xl"></div>
		<div class="absolute inset-0 bg-[linear-gradient(rgba(148,163,184,0.035)_1px,transparent_1px),linear-gradient(90deg,rgba(148,163,184,0.035)_1px,transparent_1px)] bg-[size:52px_52px] [mask-image:radial-gradient(ellipse_at_center,black,transparent_72%)]"></div>
	</div>

	<header class="relative border-b border-white/10 bg-[#080d18]/75 backdrop-blur">
		<nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
			<a href="/" class="flex items-center gap-3">
				<span class="flex h-10 w-10 items-center justify-center rounded-xl border border-sky-400/25 bg-sky-400/10 text-sm font-bold text-sky-300">
					WS
				</span>
				<span>
					<span class="block text-base font-semibold text-white">Webserv</span>
					<span class="block text-xs text-slate-400">HTTP/1.1 Server</span>
				</span>
			</a>

			<a
				href="/"
				class="rounded-lg border border-white/10 bg-white/[0.04] px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-white/20 hover:text-white"
			>
				Return home
			</a>
		</nav>
	</header>

	<main class="relative flex min-h-[calc(100vh-81px)] items-center justify-center px-6 py-12">
		<section class="w-full max-w-md rounded-3xl border border-white/10 bg-[#101827]/90 p-7 shadow-2xl shadow-sky-950/30 backdrop-blur sm:p-9">
			<div class="mb-8 text-center">
				<div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl border border-sky-400/20 bg-sky-400/10">
					<svg
						class="h-8 w-8 text-sky-300"
						fill="none"
						stroke="currentColor"
						viewBox="0 0 24 24"
						aria-hidden="true"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="1.5"
							d="M15 7a3 3 0 11-6 0 3 3 0 016 0zM5.5 20a6.5 6.5 0 0113 0"
						/>
					</svg>
				</div>

				<p class="font-mono text-xs font-semibold uppercase tracking-[0.22em] text-sky-300">
					Session Demo
				</p>

				<h1 class="mt-3 text-3xl font-bold tracking-tight text-white">
					Login
				</h1>

				<p class="mt-3 text-sm leading-6 text-slate-400">
					Enter a username to access the authenticated profile page.
				</p>
			</div>

			<!-- Original logic preserved: POST /login with name="user" -->
			<form method="POST" action="/login" class="space-y-5">
				<div>
					<label for="user" class="mb-2 block text-sm font-medium text-slate-300">
						Username
					</label>

					<input
						id="user"
						type="text"
						name="user"
						placeholder="Enter your username"
						class="w-full rounded-xl border border-white/10 bg-[#080d18] px-4 py-3.5 text-sm text-white outline-none transition placeholder:text-slate-600 focus:border-sky-400/60 focus:ring-2 focus:ring-sky-400/15"
						required
						maxlength="25"
					/>
				</div>

				<button
					type="submit"
					class="w-full rounded-xl bg-sky-400 px-5 py-3.5 text-sm font-semibold text-slate-950 transition hover:bg-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-400/40"
				>
					Sign in
				</button>
			</form>

			<div class="mt-7 rounded-xl border border-white/10 bg-[#080d18] p-4">
				<div class="flex items-center justify-between text-sm">
					<span class="text-slate-500">Endpoint</span>
					<code class="text-sky-300">POST /login</code>
				</div>
			</div>
		</section>
	</main>
</body>
</html>
