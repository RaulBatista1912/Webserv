<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Profile | Webserv</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#080d18] font-sans text-slate-100 antialiased">
	<!-- Background -->
	<div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
		<div class="absolute left-1/2 top-[-16rem] h-[34rem] w-[50rem] -translate-x-1/2 rounded-full bg-sky-500/10 blur-3xl"></div>
		<div class="absolute bottom-[-12rem] right-[-8rem] h-[28rem] w-[28rem] rounded-full bg-emerald-500/10 blur-3xl"></div>
		<div class="absolute inset-0 bg-[linear-gradient(rgba(148,163,184,0.035)_1px,transparent_1px),linear-gradient(90deg,rgba(148,163,184,0.035)_1px,transparent_1px)] bg-[size:52px_52px] [mask-image:radial-gradient(ellipse_at_center,black,transparent_72%)]"></div>
	</div>

	<header class="relative border-b border-white/10 bg-[#080d18]/75 backdrop-blur">
		<nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
			<a href="/" class="flex items-center gap-3">
				<span class="flex h-10 w-10 items-center justify-center rounded-xl border border-sky-400/25 bg-sky-400/10 text-sm font-bold text-sky-300">
					WS
				</span>
				<span>
					<span class="block text-base font-semibold text-white">Webserv</span>
					<span class="block text-xs text-slate-400">HTTP/1.1 Server</span>
				</span>
			</a>

			<span class="inline-flex items-center gap-2 rounded-lg border border-emerald-300/20 bg-emerald-300/10 px-3 py-2 text-xs font-medium text-emerald-300">
				<span class="h-2 w-2 rounded-full bg-emerald-300"></span>
				Session active
			</span>
		</nav>
	</header>

	<main class="relative flex min-h-[calc(100vh-81px)] items-center justify-center px-6 py-12">
		<section class="w-full max-w-xl rounded-3xl border border-white/10 bg-[#101827]/90 p-7 shadow-2xl shadow-sky-950/30 backdrop-blur sm:p-10">
			<div class="text-center">
				<div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl border border-emerald-300/20 bg-emerald-300/10">
					<svg
						class="h-8 w-8 text-emerald-300"
						fill="none"
						stroke="currentColor"
						viewBox="0 0 24 24"
						aria-hidden="true"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="1.5"
							d="M15 7a3 3 0 11-6 0 3 3 0 016 0zM5.5 20a6.5 6.5 0 0113 0"
						/>
					</svg>
				</div>

				<p class="font-mono text-xs font-semibold uppercase tracking-[0.22em] text-emerald-300">
					Authenticated Profile
				</p>

				<!-- Original variable preserved exactly -->
				<h1 class="mt-4 text-3xl font-bold tracking-tight text-white sm:text-4xl">
					Hello {{USER}}
				</h1>

				<!-- Original variable preserved exactly -->
				<p class="mt-4 text-base text-slate-400">
					Visits:
					<span class="font-mono font-semibold text-sky-300">{{VISITS}}</span>
				</p>
			</div>

			<div class="mt-8 rounded-xl border border-white/10 bg-[#080d18] p-4">
				<div class="flex items-center justify-between gap-4 text-sm">
					<span class="text-slate-500">Session status</span>
					<span class="font-mono text-emerald-300">ACTIVE</span>
				</div>
			</div>

			<div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
				<!-- Original routes preserved exactly -->
				<a
					href="/"
					class="rounded-xl bg-sky-400 px-6 py-3 text-center text-sm font-semibold text-slate-950 transition hover:bg-sky-300"
				>
					Back Home
				</a>

				<a
					href="/logout"
					class="rounded-xl border border-rose-400/25 bg-rose-400/10 px-6 py-3 text-center text-sm font-semibold text-rose-200 transition hover:border-rose-300/60 hover:bg-rose-400/20"
				>
					Logout
				</a>
			</div>
		</section>
	</main>
</body>
</html>
